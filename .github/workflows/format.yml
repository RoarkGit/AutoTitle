name: Check Formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  csharpier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Run `dotnet csharpier format .` locally to fix this.
      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .
